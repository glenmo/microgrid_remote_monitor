<VirtualHost *:80>
    ServerName monitor.mooramoora.org.au

    # Redirect all HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName monitor.mooramoora.org.au

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/monitor.mooramoora.org.au/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/monitor.mooramoora.org.au/privkey.pem

    # Reverse proxy to Flask app on port 8100
    ProxyPreserveHost On

    # Combined dashboard's HTML at /advanced/
    RewriteEngine On
    RewriteRule ^/advanced$ /advanced/ [R=301,L]

    # Traffic light's own API endpoints (specific — must come before /api/ catch-all)
    ProxyPass        /api/soc    http://127.0.0.1:8765/api/soc
    ProxyPassReverse /api/soc    http://127.0.0.1:8765/api/soc
    ProxyPass        /api/extras http://127.0.0.1:8765/api/extras
    ProxyPassReverse /api/extras http://127.0.0.1:8765/api/extras
    ProxyPass        /healthz    http://127.0.0.1:8765/healthz
    ProxyPassReverse /healthz    http://127.0.0.1:8765/healthz

    # Combined dashboard's APIs (used by /advanced/ pages AND for /api/push from rubberduck)
    ProxyPass        /api/       http://127.0.0.1:8100/api/
    ProxyPassReverse /api/       http://127.0.0.1:8100/api/

    # Convenience: /advanced (no trailing slash) → /advanced/
    RedirectMatch 301 ^/advanced$ /advanced/

    # Default: traffic light at root
    ProxyPass        /advanced/  http://127.0.0.1:8100/
    ProxyPassReverse /advanced/  http://127.0.0.1:8100/
    ProxyPass        /flow       http://127.0.0.1:8100/flow
    ProxyPassReverse /flow       http://127.0.0.1:8100/flow
    ProxyPass        /engineer   http://127.0.0.1:8100/engineer
    ProxyPassReverse /engineer   http://127.0.0.1:8100/engineer
    # Site icons (favicon set) are served by server_app on :8100 for every
    # page, including the traffic-light page at / (which has none of its own).
    ProxyPassMatch   ^/(favicon\.ico|favicon\.svg|favicon-96x96\.png|apple-touch-icon\.png|web-app-manifest-(?:192x192|512x512)\.png|site\.webmanifest)$ http://127.0.0.1:8100/$1

    # EV charger status mirror (ev-mirror.service, pushed from noisy in the lab)
    RewriteRule ^/ev$ /ev/ [R=301,L]
    ProxyPass        /ev/        http://127.0.0.1:8110/
    ProxyPassReverse /ev/        http://127.0.0.1:8110/
    # Lodge Comfort: public aircon dashboard (comfort_monitor/, comfort-monitor.service :8125,
    # pushed from LodgyBox). Must sit above the catch-all "ProxyPass / ..." line.
    RewriteRule ^/comfort$ /comfort/ [R=301,L]
    ProxyPass        /comfort/   http://127.0.0.1:8125/
    ProxyPassReverse /comfort/   http://127.0.0.1:8125/
    # Dacha Comfort: aircon status page (dacha_monitor/, dacha-monitor.service :8126,
    # pushed from noisy). Must sit above the catch-all "ProxyPass / ..." line.
    RewriteRule ^/dacha$ /dacha/ [R=301,L]
    ProxyPass        /dacha/     http://127.0.0.1:8126/
    ProxyPassReverse /dacha/     http://127.0.0.1:8126/
    # Hot water dashboard (hotwater_controller repo, hotwater-dashboard.service :8120).
    # Must sit above the catch-all "ProxyPass / ..." line.
    RewriteRule ^/hotwater$ /hotwater/ [R=301,L]
    ProxyPass        /hotwater/  http://127.0.0.1:8120/
    ProxyPassReverse /hotwater/  http://127.0.0.1:8120/
    ProxyPass        /           http://127.0.0.1:8765/
    ProxyPassReverse /           http://127.0.0.1:8765/

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/monitor.mooramoora.org.au-error.log
    CustomLog ${APACHE_LOG_DIR}/monitor.mooramoora.org.au-access.log combined
</VirtualHost>
