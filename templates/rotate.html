<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Hard reload every 30 min so a page that was down at load time comes back. -->
<meta http-equiv="refresh" content="1800">
<title>Microgrid Kiosk</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  /* Every page stays loaded (so its own polling keeps it current); only the
     active one is visible. Switching visibility avoids a reload flash. */
  iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; visibility: hidden;
  }
  iframe.active { visibility: visible; }
</style>
</head>
<body>
<script>
  const URLS = {{ urls | tojson }};
  const SECS = {{ secs | tojson }};

  const frames = URLS.map(url => {
    const f = document.createElement("iframe");
    f.src = url;
    document.body.appendChild(f);
    return f;
  });

  let current = 0;
  frames[0].classList.add("active");
  if (frames.length > 1) {
    setInterval(() => {
      frames[current].classList.remove("active");
      current = (current + 1) % frames.length;
      frames[current].classList.add("active");
    }, SECS * 1000);
  }
</script>
</body>
</html>
